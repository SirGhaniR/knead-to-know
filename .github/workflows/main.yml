name: Deploy Laravel to InfinityFree

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, bcmath, ctype, fileinfo, json, pdo_mysql, tokenizer, xml
        tools: composer
    
    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: vendor/
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install Composer dependencies
      run: |
        composer install --no-interaction --ignore-platform-req=php
        composer dump-autoload --optimize
    
    - name: Cache NPM dependencies
      uses: actions/cache@v3
      with:
        path: node_modules/
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install NPM dependencies
      run: npm install
    
    - name: Build assets
      run: npm run build
    
    - name: Create production .env file
      run: |
        cat > .env << 'EOF'
        APP_NAME=KneadToKnow
        APP_ENV=production
        APP_KEY=${{ secrets.APP_KEY }}
        APP_DEBUG=false
        APP_URL=${{ secrets.APP_URL }}
        
        DB_CONNECTION=mysql
        DB_HOST=${{ secrets.DB_HOST }}
        DB_PORT=3306
        DB_DATABASE=${{ secrets.DB_DATABASE }}
        DB_USERNAME=${{ secrets.DB_USERNAME }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        
        BROADCAST_DRIVER=log
        CACHE_DRIVER=file
        QUEUE_CONNECTION=sync
        SESSION_DRIVER=file
        SESSION_LIFETIME=120
        EOF
        
        # Verify .env was created
        echo "✅ .env file created"
    
    - name: Set permissions
      run: |
        chmod -R 755 storage
        chmod -R 755 bootstrap/cache
    
    - name: Optimize Laravel
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
    
    - name: Debug - Check files before upload
      run: |
        echo "=== Files in current directory ==="
        ls -la
        echo ""
        echo "=== Check .env exists ==="
        test -f .env && echo "✅ .env exists!" || echo "❌ .env is missing!"
        echo ""
        echo "=== Check public folder ==="
        test -d public && echo "✅ public folder exists!" || echo "❌ public folder missing!"
        echo ""
        echo "=== Check index.php in public ==="
        test -f public/index.php && echo "✅ public/index.php exists!" || echo "❌ public/index.php missing!"
    
    - name: Deploy to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs
        exclude: |
          .git/
          .github/
          node_modules/
          .env.example
          tests/
          .gitattributes
          .gitignore
          phpunit.xml
          README.md
          .ftp-deploy-sync-state.json
          .env.local
          .env.testing
          .phpunit.cache
          .vscode/
          .idea/
          # .env is NOT excluded - it will be uploaded
        state-name: .ftp-deploy-sync-state.json
